aid: lakrids-by-b-low
name: LAKRIDS BY BÜLOW
description: >-
  LAKRIDS BY BÜLOW is a Danish gourmet liquorice maker founded by Johan Bülow,
  who opened his first shop in Svaneke on the island of Bornholm on 07.07.2007
  and built the brand by cooking liquorice on-site so the aroma drew customers
  in. Trading as Lakrids by Johan Bülow A/S (CVR 33041586) from Sydholmen 5,
  2650 Hvidovre, Denmark, the company makes plain and chocolate-coated
  liquorice — its flagship being "A - THE ORIGINAL", a gluten-free sweet
  liquorice core coated in milk chocolate — and sells direct to consumers
  across Europe alongside concept stores, retail partners and a B2B corporate
  gifting business. The company operates no public developer program: its
  storefront runs on the BigCommerce Stencil platform, and the only API surface
  reachable on its own host is platform-provided and documented by BigCommerce.
